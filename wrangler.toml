name = "map-concerts"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 静态资源在 public/ 子目录
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 首个管理员用户名: 注册时若库中尚无 admin 且用户名匹配此项 → 自动成为 admin
[vars]
BOOTSTRAP_ADMIN = "admin"

# 审核密码(ADMIN_PASSWORD)用 Cloudflare Secret 设置:
#   npx wrangler secret put ADMIN_PASSWORD
[secrets]
required = ["ADMIN_PASSWORD"]

# D1 演出数据库(本地开发自动建本地库; 生产环境绑定远程 D1)
[[d1_databases]]
binding = "DB"
database_name = "map-concerts-db"
